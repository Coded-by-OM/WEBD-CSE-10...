<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shopping Bill</title>
</head>

<body>
    <h1 align="center">
        <font color="Blue">Shopping Bill</font>
    </h1>
    <table align="center" border="2" cellpadding="10" cellspacing="1">
        <tr bgcolor="Lightblue" align="center">
        <th>Items</th>
        <th>Quantity</th>
        <th>Price(₹)</th>
        <th>Amount(₹)</th>
        </tr>
        <tr align="center">
            <td>Notebook</td>
            <td>2</td>
            <td>50</td>
            <td>100</td>
        </tr>
        <tr align="center">
            <td>Pen</td>
            <td>5</td>
            <td>10</td>
            <td>50</td>
        </tr>
        <tr align="center">
            <td>Book</td>
            <td>1</td>
            <td>200</td>
            <td>200</td>
        </tr>
        <tr align="center">
            <td>Bag</td>
            <td>1</td>
            <td>500</td>
            <td>500</td>
        </tr>
        <tr bgcolor="Lightblue" align="center">
            <th colspan="3">Total</th>
            <th>850</th>
        </tr>
    </table>
</body>
</html>
